<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrbitLab 學測自然空間模型工作台</title>
  <meta name="description" content="可離線執行的學測自然 3D 視覺化學習系統，整合天文、地球系統與生物微觀結構的互動模型、診斷練習、錯因回放與教師投影工具。">
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(14% 0.035 245);
      --bg-soft: oklch(18% 0.04 238);
      --ink: oklch(94% 0.018 92);
      --muted: oklch(75% 0.03 230);
      --quiet: oklch(61% 0.028 230);
      --surface: oklch(23% 0.04 239 / 0.92);
      --surface-2: oklch(28% 0.046 236 / 0.95);
      --surface-3: oklch(34% 0.052 232 / 0.9);
      --paper: oklch(91% 0.044 84);
      --paper-ink: oklch(22% 0.04 74);
      --line: oklch(100% 0 0 / 0.14);
      --line-strong: oklch(88% 0.04 88 / 0.34);
      --accent: oklch(78% 0.135 74);
      --accent-ink: oklch(18% 0.045 72);
      --cyan: oklch(74% 0.11 192);
      --magenta: oklch(74% 0.13 330);
      --green: oklch(75% 0.13 152);
      --red: oklch(68% 0.17 29);
      --amber: oklch(84% 0.14 91);
      --shadow: 0 24px 80px oklch(0% 0 0 / 0.38);
      --radius: 8px;
      --radius-sm: 5px;
      --control: 44px;
      --font-display: "Iowan Old Style", "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      --font-body: "Hiragino Sans CNS", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --font-mono: "SFMono-Regular", "Cascadia Mono", "Consolas", monospace;
      --motion-fast: 150ms;
      --motion: 260ms;
      --motion-slow: 620ms;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.55;
      background:
        radial-gradient(circle at 12% 8%, oklch(38% 0.085 232 / 0.28), transparent 32rem),
        radial-gradient(circle at 86% 18%, oklch(40% 0.12 80 / 0.16), transparent 29rem),
        linear-gradient(135deg, oklch(12% 0.036 245), oklch(18% 0.045 238) 52%, oklch(13% 0.035 252));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.34;
      background-image:
        linear-gradient(oklch(100% 0 0 / 0.055) 1px, transparent 1px),
        linear-gradient(90deg, oklch(100% 0 0 / 0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
      z-index: -1;
    }

    a { color: inherit; }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: var(--control);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(28% 0.045 237 / 0.86);
      color: var(--ink);
      cursor: pointer;
      transition: transform var(--motion-fast), border-color var(--motion-fast), background var(--motion-fast), opacity var(--motion-fast);
      touch-action: manipulation;
    }

    button:hover { border-color: var(--line-strong); background: oklch(33% 0.052 235 / 0.96); }
    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { opacity: 0.46; cursor: not-allowed; }

    :focus-visible {
      outline: 3px solid oklch(82% 0.12 80 / 0.85);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    .skip-link {
      position: absolute;
      left: 1rem;
      top: 0.8rem;
      z-index: 20;
      transform: translateY(-180%);
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-sm);
      font-weight: 800;
    }

    .skip-link:focus { transform: translateY(0); }

    .app-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100svh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      display: grid;
      grid-template-columns: minmax(12rem, 1fr) auto auto;
      align-items: center;
      gap: 1rem;
      padding: 0.7rem clamp(0.8rem, 2.5vw, 1.6rem);
      border-bottom: 1px solid var(--line);
      background: oklch(14% 0.035 245 / 0.88);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .mark {
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, var(--accent) 0 0.18rem, transparent 0.2rem),
        conic-gradient(from 40deg, transparent 0 24%, oklch(80% 0.12 80 / 0.85) 24% 27%, transparent 27% 59%, oklch(72% 0.11 195 / 0.85) 59% 62%, transparent 62%),
        radial-gradient(circle, transparent 0 0.48rem, oklch(100% 0 0 / 0.13) 0.5rem 0.54rem, transparent 0.56rem);
      box-shadow: inset 0 0 24px oklch(78% 0.12 80 / 0.18);
      flex: 0 0 auto;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 2.2vw, 1.5rem);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-metrics {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .metric-pill {
      min-height: 2.15rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(22% 0.04 238 / 0.76);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .metric-pill strong { color: var(--ink); font-family: var(--font-mono); }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.45rem;
    }

    .top-actions button,
    .compact-button {
      padding: 0.45rem 0.7rem;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .primary {
      color: var(--accent-ink);
      background: linear-gradient(180deg, var(--accent), oklch(70% 0.13 75));
      border-color: oklch(90% 0.1 85 / 0.65);
      font-weight: 900;
    }

    .primary:hover {
      background: linear-gradient(180deg, oklch(83% 0.14 76), var(--accent));
      border-color: oklch(96% 0.07 80 / 0.84);
    }

    main {
      min-width: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(17rem, 21rem) minmax(0, 1fr) minmax(20rem, 24rem);
      gap: 0.8rem;
      padding: 0.8rem;
      min-height: calc(100svh - 4.15rem);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--surface), oklch(20% 0.04 239 / 0.92));
      box-shadow: var(--shadow);
      min-width: 0;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.85rem 0.95rem;
      border-bottom: 1px solid var(--line);
      background: oklch(25% 0.044 238 / 0.74);
    }

    .panel-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .panel-note {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .scroll {
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: oklch(56% 0.04 230 / 0.7) transparent;
    }

    .module-panel,
    .detail-panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 0;
      max-height: calc(100svh - 5.75rem);
    }

    .module-search {
      padding: 0.75rem;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 0.5rem;
    }

    .input,
    .select,
    textarea {
      width: 100%;
      min-height: var(--control);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(17% 0.036 244 / 0.9);
      color: var(--ink);
      padding: 0.65rem 0.75rem;
    }

    textarea {
      min-height: 7.6rem;
      resize: vertical;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.32rem;
      padding: 0.25rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(18% 0.035 244 / 0.82);
    }

    .segmented button {
      min-height: 2.4rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0.4rem;
      font-size: 0.78rem;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--paper);
      color: var(--paper-ink);
      font-weight: 900;
    }

    .module-list {
      display: grid;
      gap: 0.55rem;
      padding: 0.75rem;
    }

    .module-card {
      position: relative;
      display: grid;
      gap: 0.45rem;
      width: 100%;
      min-height: auto;
      padding: 0.75rem;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: oklch(24% 0.043 238 / 0.72);
    }

    .module-card:hover { transform: translateY(-1px); }
    .module-card[aria-current="true"] {
      border-color: oklch(82% 0.12 78 / 0.72);
      background: linear-gradient(150deg, oklch(32% 0.06 235 / 0.95), oklch(25% 0.045 236 / 0.94));
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .module-card h3 {
      margin: 0;
      color: var(--ink);
      font-size: 0.98rem;
      line-height: 1.25;
    }

    .module-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .tags,
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tag,
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 1.55rem;
      padding: 0.2rem 0.43rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: oklch(18% 0.036 245 / 0.7);
      font-size: 0.7rem;
    }

    .chip.strong {
      color: var(--paper-ink);
      background: var(--paper);
      border-color: transparent;
      font-weight: 900;
    }

    .mastery-line {
      position: relative;
      height: 0.42rem;
      overflow: hidden;
      border-radius: 999px;
      background: oklch(100% 0 0 / 0.09);
    }

    .mastery-line span {
      display: block;
      height: 100%;
      width: var(--value, 0%);
      background: linear-gradient(90deg, var(--red), var(--amber), var(--green));
      border-radius: inherit;
      transition: width var(--motion);
    }

    .stage {
      display: grid;
      grid-template-rows: auto minmax(26rem, 1fr) auto;
      min-height: 0;
      overflow: hidden;
    }

    .stage-toolbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem;
      border-bottom: 1px solid var(--line);
      background: oklch(17% 0.036 244 / 0.72);
    }

    .model-title {
      display: grid;
      gap: 0.1rem;
      min-width: 0;
    }

    .model-title h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2vw, 1.8rem);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .model-title small {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar-cluster {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .canvas-wrap {
      position: relative;
      min-height: 28rem;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, oklch(35% 0.06 235 / 0.38), transparent 28rem),
        linear-gradient(180deg, oklch(13% 0.035 245), oklch(18% 0.04 236));
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 28rem;
      cursor: grab;
      touch-action: none;
    }

    canvas:active { cursor: grabbing; }

    .canvas-hud {
      position: absolute;
      inset: auto 1rem 1rem 1rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.8rem;
      align-items: end;
      pointer-events: none;
    }

    .caption {
      max-width: 52rem;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: oklch(13% 0.035 245 / 0.72);
      backdrop-filter: blur(14px);
      font-size: 0.9rem;
    }

    .caption strong { color: var(--accent); }

    .hud-readout {
      display: grid;
      gap: 0.35rem;
      min-width: 10rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: oklch(13% 0.035 245 / 0.72);
      backdrop-filter: blur(14px);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .readout-row {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .readout-row span:last-child { color: var(--accent); }

    .controls {
      display: grid;
      grid-template-columns: minmax(12rem, 1fr) auto auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.75rem;
      border-top: 1px solid var(--line);
      background: oklch(16% 0.036 244 / 0.84);
    }

    .range-group {
      display: grid;
      gap: 0.35rem;
    }

    .range-label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    input[type="range"] {
      width: 100%;
      min-height: 44px;
      accent-color: var(--accent);
    }

    .layer-controls {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      min-height: 2.55rem;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(22% 0.04 239 / 0.75);
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      inline-size: 1rem;
      block-size: 1rem;
      accent-color: var(--accent);
    }

    .detail-panel {
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .detail-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.25rem;
      padding: 0.5rem;
      border-bottom: 1px solid var(--line);
      background: oklch(16% 0.036 244 / 0.72);
    }

    .detail-tabs button {
      min-height: 2.45rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.76rem;
      padding: 0.35rem;
    }

    .detail-tabs button[aria-selected="true"] {
      background: var(--paper);
      color: var(--paper-ink);
      font-weight: 900;
    }

    .detail-content {
      padding: 0.85rem;
      display: grid;
      gap: 0.8rem;
      align-content: start;
    }

    .info-block {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: oklch(22% 0.04 239 / 0.66);
      padding: 0.85rem;
      display: grid;
      gap: 0.55rem;
    }

    .info-block h3,
    .info-block h4 {
      margin: 0;
      font-size: 0.98rem;
    }

    .info-block p,
    .info-block li {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .info-block p,
    .info-block ul,
    .info-block ol {
      margin-block: 0;
    }

    .info-block ul,
    .info-block ol {
      padding-inline-start: 1.2rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.55rem;
    }

    .stat-box {
      padding: 0.7rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(17% 0.036 244 / 0.72);
    }

    .stat-box span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .stat-box strong {
      display: block;
      margin-top: 0.18rem;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--accent);
    }

    .rubric {
      display: grid;
      gap: 0.42rem;
    }

    .rubric-row {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: 0.55rem;
      align-items: center;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .rubric-bar {
      height: 0.48rem;
      border-radius: 999px;
      background: oklch(100% 0 0 / 0.08);
      overflow: hidden;
    }

    .rubric-bar span {
      display: block;
      height: 100%;
      width: var(--score, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
    }

    .question-card {
      display: grid;
      gap: 0.55rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.85rem;
      background: var(--paper);
      color: var(--paper-ink);
    }

    .question-card h3 {
      margin: 0;
      color: var(--paper-ink);
      font-size: 0.98rem;
    }

    .choice-list {
      display: grid;
      gap: 0.4rem;
    }

    .choice {
      min-height: 2.8rem;
      padding: 0.6rem;
      border: 1px solid oklch(54% 0.04 78 / 0.28);
      border-radius: var(--radius-sm);
      background: oklch(99% 0.02 90 / 0.92);
      color: var(--paper-ink);
      text-align: left;
    }

    .choice[aria-pressed="true"] {
      border-color: oklch(60% 0.12 78);
      background: oklch(90% 0.08 84);
      font-weight: 900;
    }

    .feedback {
      min-height: 2rem;
      padding: 0.65rem;
      border-radius: var(--radius-sm);
      background: oklch(20% 0.04 239 / 0.82);
      color: var(--ink);
      font-size: 0.88rem;
    }

    .feedback.good { border: 1px solid oklch(78% 0.13 150 / 0.56); }
    .feedback.needs-work { border: 1px solid oklch(82% 0.14 74 / 0.56); }

    .path-list {
      display: grid;
      gap: 0.55rem;
    }

    .path-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.6rem;
      align-items: start;
      padding: 0.72rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(17% 0.036 244 / 0.65);
    }

    .path-item input {
      margin-top: 0.35rem;
      accent-color: var(--accent);
    }

    .path-item strong {
      display: block;
      font-size: 0.9rem;
    }

    .path-item span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .teacher-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.55rem;
    }

    .codebox {
      min-height: 6rem;
      padding: 0.65rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: oklch(13% 0.035 245);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .drawer {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 30;
      display: none;
      max-height: min(88svh, 48rem);
      border-top: 1px solid var(--line-strong);
      background: oklch(14% 0.035 245 / 0.96);
      box-shadow: 0 -24px 70px oklch(0% 0 0 / 0.42);
      backdrop-filter: blur(18px);
    }

    .drawer[data-open="true"] {
      display: block;
      animation: drawer-in var(--motion) ease-out;
    }

    @keyframes drawer-in {
      from { transform: translateY(1.5rem); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .drawer-inner {
      width: min(82rem, 100%);
      margin-inline: auto;
      padding: 1rem;
      display: grid;
      gap: 0.8rem;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .drawer-head h2 {
      margin: 0;
      font-family: var(--font-display);
    }

    .atlas-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      max-height: 28rem;
      overflow: auto;
    }

    .atlas-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: oklch(22% 0.04 239 / 0.8);
      padding: 0.8rem;
      display: grid;
      gap: 0.5rem;
    }

    .atlas-card h3 {
      margin: 0;
      font-size: 1rem;
    }

    .atlas-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      z-index: 35;
      right: 1rem;
      bottom: 1rem;
      width: min(24rem, calc(100vw - 2rem));
      display: none;
      padding: 0.85rem 0.95rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--paper-ink);
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    .toast[data-open="true"] {
      display: block;
      animation: toast-in var(--motion) ease-out;
    }

    @keyframes toast-in {
      from { transform: translateY(0.75rem); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .presentation .module-panel,
    .presentation .detail-panel,
    .presentation .top-actions,
    .presentation .header-metrics {
      display: none;
    }

    .presentation .workspace {
      grid-template-columns: 1fr;
      padding: 0;
      min-height: calc(100svh - 3.8rem);
    }

    .presentation .stage {
      border-radius: 0;
      border-inline: 0;
      box-shadow: none;
    }

    .presentation .canvas-wrap,
    .presentation canvas {
      min-height: calc(100svh - 11rem);
    }

    .high-contrast {
      --bg: oklch(8% 0.02 245);
      --bg-soft: oklch(11% 0.02 245);
      --ink: oklch(98% 0.01 95);
      --muted: oklch(87% 0.02 92);
      --line: oklch(100% 0 0 / 0.34);
      --line-strong: oklch(100% 0 0 / 0.6);
      --surface: oklch(13% 0.02 245 / 0.96);
      --surface-2: oklch(16% 0.02 245 / 0.96);
      --accent: oklch(90% 0.12 90);
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: minmax(15rem, 18rem) minmax(0, 1fr);
      }

      .detail-panel {
        grid-column: 1 / -1;
        max-height: none;
      }

      .detail-content {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      .detail-tabs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .header-metrics,
      .top-actions {
        justify-content: start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .module-panel,
      .detail-panel {
        max-height: none;
      }

      .stage-toolbar,
      .controls {
        grid-template-columns: 1fr;
      }

      .toolbar-cluster,
      .layer-controls {
        justify-content: start;
      }

      .canvas-hud {
        position: static;
        padding: 0.75rem;
        grid-template-columns: 1fr;
        background: oklch(13% 0.035 245);
      }

      .caption,
      .hud-readout {
        background: transparent;
      }

      .detail-content {
        grid-template-columns: 1fr;
      }

      .atlas-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .brand-title { white-space: normal; }
      .top-actions,
      .header-metrics { display: grid; grid-template-columns: 1fr 1fr; }
      .top-actions button,
      .metric-pill { width: 100%; justify-content: center; }
      .detail-tabs { grid-template-columns: repeat(2, 1fr); }
      .stat-grid { grid-template-columns: 1fr; }
      .path-item { grid-template-columns: auto 1fr; }
      .path-item .chip { grid-column: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到模型工作台</a>

  <div class="app-shell" id="app">
    <header class="topbar" aria-label="系統工具列">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div class="brand-text">
          <h1 class="brand-title">OrbitLab 學測自然空間模型工作台</h1>
          <span class="brand-subtitle">天文、地球系統、微觀結構的互動模型與診斷學習</span>
        </div>
      </div>

      <div class="header-metrics" aria-live="polite">
        <span class="metric-pill">熟練度 <strong id="globalMastery">0%</strong></span>
        <span class="metric-pill">今日任務 <strong id="taskCount">0</strong></span>
        <span class="metric-pill">連續答對 <strong id="streakCount">0</strong></span>
      </div>

      <div class="top-actions">
        <button class="compact-button" type="button" id="openAtlas">概念總覽</button>
        <button class="compact-button" type="button" id="toggleContrast">高對比</button>
        <button class="compact-button primary" type="button" id="presentationMode">教師投影</button>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <aside class="panel module-panel" aria-label="模型清單">
        <div class="panel-header">
          <div>
            <h2 class="panel-title">模型庫</h2>
            <span class="panel-note">搜尋概念、錯因或題型</span>
          </div>
        </div>

        <div class="module-search">
          <label>
            <span class="panel-note">快速搜尋</span>
            <input class="input" id="moduleSearch" type="search" placeholder="例：月球、颱風、RNA、海嘯" autocomplete="off">
          </label>
          <div class="segmented" aria-label="篩選領域">
            <button type="button" data-domain="all" aria-pressed="true">全部</button>
            <button type="button" data-domain="earth" aria-pressed="false">地科</button>
            <button type="button" data-domain="bio" aria-pressed="false">生物</button>
          </div>
        </div>

        <div class="scroll module-list" id="moduleList" tabindex="0"></div>
      </aside>

      <section class="panel stage" aria-label="互動模型">
        <div class="stage-toolbar">
          <div class="model-title">
            <h2 id="modelName">模型名稱</h2>
            <small id="modelSubtitle">模型說明</small>
          </div>

          <div class="chips" id="modelTags" aria-label="模型標籤"></div>

          <div class="toolbar-cluster">

            <button class="compact-button" type="button" id="snapshotState">複製狀態</button>
            <button class="compact-button primary" type="button" id="diagnoseNow">開始診斷</button>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="modelCanvas" width="1400" height="900" aria-label="互動視覺模型，拖曳可旋轉，方向鍵可調整視角，加號和減號可縮放。" tabindex="0"></canvas>
          <div class="canvas-hud">
            <div class="caption" id="modelCaption"></div>
            <div class="hud-readout" aria-label="模型狀態">
              <div class="readout-row"><span>time</span><span id="readoutTime">0.00</span></div>
              <div class="readout-row"><span>scale</span><span id="readoutScale">1.00</span></div>
              <div class="readout-row"><span>angle</span><span id="readoutAngle">0°</span></div>
            </div>
          </div>
        </div>

        <div class="controls" aria-label="模型控制">
          <label class="range-group">
            <span class="range-label"><span>時間／尺度軸</span><output id="timeOutput" for="timeSlider">0</output></span>
            <input id="timeSlider" type="range" min="0" max="100" value="36">
          </label>

          <label class="range-group">
            <span class="range-label"><span>縮放</span><output id="zoomOutput" for="zoomSlider">1.00</output></span>
            <input id="zoomSlider" type="range" min="60" max="180" value="100">
          </label>

          <div class="layer-controls" aria-label="圖層切換">
            <label class="toggle"><input type="checkbox" data-layer="grid" checked>網格</label>
            <label class="toggle"><input type="checkbox" data-layer="labels" checked>標籤</label>
            <label class="toggle"><input type="checkbox" data-layer="vectors" checked>向量</label>
            <label class="toggle"><input type="checkbox" data-layer="misconception" checked>錯因</label>
          </div>
        </div>
      </section>

      <aside class="panel detail-panel" aria-label="學習與診斷">
        <div class="panel-header">
          <div>
            <h2 class="panel-title">學習控制台</h2>

          </div>
        </div>

        <div class="detail-tabs" role="tablist" aria-label="控制台分頁">

          <button type="button" role="tab" aria-selected="false" data-tab="quiz">診斷</button>
          <button type="button" role="tab" aria-selected="false" data-tab="path">路徑</button>
          <button type="button" role="tab" aria-selected="false" data-tab="teacher">教師</button>
          <button type="button" role="tab" aria-selected="false" data-tab="notes">筆記</button>
        </div>

        <div class="scroll detail-content" id="detailContent"></div>
      </aside>
    </main>
  </div>

  <section class="drawer" id="atlasDrawer" aria-label="概念總覽" aria-hidden="true">

      <div class="drawer-head">
        <div>

        <button class="compact-button" type="button" id="closeAtlas">關閉</button>

      <div class="atlas-grid" id="atlasGrid"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));

      function activeModule() {
        return MODULES.find((item) => item.id === state.activeId) || MODULES[0];
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (!saved || typeof saved !== "object") return;
          state.activeId = typeof saved.activeId === "string" ? saved.activeId : state.activeId;
          state.time = Number.isFinite(saved.time) ? clamp(saved.time, 0, 100) : state.time;
          state.zoom = Number.isFinite(saved.zoom) ? clamp(saved.zoom, 0.6, 1.8) : state.zoom;
          state.angleX = Number.isFinite(saved.angleX) ? saved.angleX : state.angleX;
          state.angleY = Number.isFinite(saved.angleY) ? saved.angleY : state.angleY;
          state.streak = Number.isFinite(saved.streak) ? saved.streak : state.streak;
          state.progress = mergeProgress(saved.progress);
        } catch {
          state.progress = cloneProgress(DEFAULT_PROGRESS);
        }
      }


      function cloneProgress(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function mergeProgress(saved) {
        const next = cloneProgress(DEFAULT_PROGRESS);
        if (!saved || typeof saved !== "object") return next;
        for (const item of MODULES) {
          const entry = saved[item.id];
          if (!entry || typeof entry !== "object") continue;
          next[item.id] = {
            attempts: Number.isFinite(entry.attempts) ? Math.max(0, entry.attempts) : 0,
            correct: Number.isFinite(entry.correct) ? Math.max(0, entry.correct) : 0,
            mastery: Number.isFinite(entry.mastery) ? clamp(entry.mastery, 0, 100) : 22,
            notes: typeof entry.notes === "string" ? entry.notes.slice(0, 3000) : "",
            done: Array.isArray(entry.done) ? entry.done.filter((value) => typeof value === "string") : []
          };
        }
        return next;
      }

      function saveState() {
        const payload = {
          activeId: state.activeId,
          time: state.time,
          zoom: state.zoom,
          angleX: state.angleX,
          angleY: state.angleY,
          streak: state.streak,
          progress: state.progress
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.dataset.open = "true";
        toastTimer = window.setTimeout(() => {
          els.toast.dataset.open = "false";
        }, 2600);
      }

      function filteredModules() {
        const query = state.query.trim().toLowerCase();
        return MODULES.filter((item) => {
          const domainMatch = state.domain === "all" || item.domain === state.domain;
          const haystack = [item.title, item.subtitle, item.theme, ...item.tags, ...item.concepts, ...item.misconception].join(" ").toLowerCase();
          return domainMatch && (!query || haystack.includes(query));
        });
      }

      function renderModuleList() {
        const list = filteredModules();
        if (!list.length) {
          els.moduleList.innerHTML = '<p class="panel-note">找不到符合的模型；試試「天文」、「RNA」或「颱風」。</p>';
          return;

        els.moduleList.innerHTML = list.map((item) => {
          const progress = state.progress[item.id];

            state.selectedChoice = null;

            renderAll();
            els.canvas.focus({ preventScroll: true });
          });
        });

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

        els.taskCount.textContent = String(remaining);
        els.streakCount.textContent = String(state.streak);

            state.layers.grid = false;

            state.layers.vectors = false;
            state.layers.misconception = true;
            syncLayerInputs();
            renderAll();
          });

          document.getElementById("focusVectors").addEventListener("click", () => {
            state.layers.grid = false;
            state.layers.labels = true;
            state.layers.vectors = true;
            state.layers.misconception = false;
            syncLayerInputs();
            renderAll();
          });

          document.getElementById("copyTeacherState").addEventListener("click", copyState);
          document.getElementById("importState").addEventListener("click", () => {
            const raw = document.getElementById("stateImport").value.trim();
            if (!raw) {
              showToast("沒有可匯入的狀態碼。");
              return;
            }
            if (importState(raw)) showToast("已匯入狀態。");
            else showToast("狀態碼格式不正確。");
          });
          return;
        }

        if (state.tab === "notes") {
          els.detailContent.innerHTML = `
            <section class="info-block">
              <h3>我的模型筆記</h3>
              <p>筆記儲存在本機瀏覽器，不會上傳。</p>
              <textarea id="noteField" placeholder="例：颱風題先找測站相對中心的位置，再判斷環流方向。">${escapeHtml(progress.notes)}</textarea>
              <button type="button" class="primary" id="saveNote">儲存筆記</button>
            </section>

            <section class="info-block">
              <h3>答題自檢</h3>
              <ul>
                <li>我能把題目文字轉成模型變數。</li>
                <li>我能說明圖中哪個箭頭、曲線或構造支持答案。</li>
                <li>我能指出一個常見錯因並修正。</li>
              </ul>
            </section>
          `;

          document.getElementById("saveNote").addEventListener("click", () => {
            state.progress[item.id].notes = document.getElementById("noteField").value.slice(0, 3000);
            saveState();
            showToast("筆記已儲存。");
          });
        }
      }

      function renderRubric(item) {
        const progress = state.progress[item.id];
        const base = progress.mastery;
        const scores = item.examSkills.map((skill, index) => {
          const score = clamp(base + (index - 1) * 9 + Math.sin((state.time + index * 17) / 20) * 8, 0, 100);
          return `<div class="rubric-row"><span>${escapeHtml(skill.slice(0, 8))}</span><div class="rubric-bar"><span style="--score:${score}%"></span></div></div>`;
        });
        return scores.join("");
      }

      function buildLearningPath(item) {
        const progress = state.progress[item.id];
        const taskData = item.tasks.map((text, index) => ({
          id: `${item.id}-${index}`,
          title: text,
          meta: index === 0 ? "模型操作" : index === 1 ? "圖表判讀" : "文字推論",
          weight: Math.max(1, 100 - progress.mastery) + index * 3
        }));

        return taskData.sort((a, b) => b.weight - a.weight);
      }

      function renderTask(task, index, checked) {
        return `
          <label class="path-item">
            <input type="checkbox" data-task="${escapeHtml(task.id)}" ${checked ? "checked" : ""}>
            <span>
              <strong>${index + 1}. ${escapeHtml(task.title)}</strong>
              <span>${escapeHtml(task.meta)} · 建議先在模型上完成再作答</span>
            </span>
            <span class="chip">${checked ? "完成" : "待做"}</span>
          </label>
        `;
      }

      function submitAnswer() {
        const item = activeModule();
        if (state.selectedChoice === null) {
          showToast("請先選一個答案。");
          return;
        }

        const progress = state.progress[item.id];
        progress.attempts += 1;
        if (state.selectedChoice === item.question.answer) {
          progress.correct += 1;
          progress.mastery = clamp(progress.mastery + 11, 0, 100);
          state.streak += 1;
          showToast("答對，模型熟練度已提升。");
        } else {
          progress.mastery = clamp(progress.mastery - 4, 0, 100);
          state.streak = 0;
          state.layers.misconception = true;
          syncLayerInputs();
          showToast("已開啟錯因圖層，回到模型觀察關鍵差異。");
        }

        saveState();
        renderAll();
      }

      function renderAtlas() {
        els.atlasGrid.innerHTML = MODULES.map((item) => `
          <article class="atlas-card">
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.summary)}</p>
            <div class="chips">${item.concepts.map((concept) => `<span class="chip">${escapeHtml(concept)}</span>`).join("")}</div>
            <button type="button" class="compact-button" data-atlas-module="${item.id}">開啟模型</button>
          </article>
        `).join("");

        els.atlasGrid.querySelectorAll("[data-atlas-module]").forEach((button) => {
          button.addEventListener("click", () => {
            state.activeId = button.dataset.atlasModule;
            closeAtlas();
            saveState();
            renderAll();
          });
        });
      }

      function setTab(tab) {
        state.tab = tab;
        document.querySelectorAll("[role='tab'][data-tab]").forEach((button) => {
          button.setAttribute("aria-selected", String(button.dataset.tab === tab));
        });
        renderDetail();
      }

      function syncLayerInputs() {
        document.querySelectorAll("[data-layer]").forEach((input) => {
          input.checked = Boolean(state.layers[input.dataset.layer]);
        });
      }

      function resetView() {
        state.angleX = -0.35;
        state.angleY = 0.55;
        state.zoom = 1;
        state.time = 36;
        saveState();
        renderAll();
      }

      function exportState() {
        const payload = {
          activeId: state.activeId,
          time: state.time,
          zoom: Number(state.zoom.toFixed(3)),
          angleX: Number(state.angleX.toFixed(3)),
          angleY: Number(state.angleY.toFixed(3)),
          layers: state.layers
        };
        return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      }

      function importState(raw) {
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(raw))));
          if (!decoded || typeof decoded !== "object") return false;
          if (!MODULES.some((item) => item.id === decoded.activeId)) return false;
          state.activeId = decoded.activeId;
          state.time = Number.isFinite(decoded.time) ? clamp(decoded.time, 0, 100) : state.time;
          state.zoom = Number.isFinite(decoded.zoom) ? clamp(decoded.zoom, 0.6, 1.8) : state.zoom;
          state.angleX = Number.isFinite(decoded.angleX) ? decoded.angleX : state.angleX;
          state.angleY = Number.isFinite(decoded.angleY) ? decoded.angleY : state.angleY;
          if (decoded.layers && typeof decoded.layers === "object") {
            state.layers = {
              grid: Boolean(decoded.layers.grid),
              labels: Boolean(decoded.layers.labels),
              vectors: Boolean(decoded.layers.vectors),
              misconception: Boolean(decoded.layers.misconception)
            };
          }
          syncLayerInputs();
          saveState();
          renderAll();
          return true;
        } catch {
          return false;
        }
      }

      async function copyState() {
        const payload = exportState();
        try {
          await navigator.clipboard.writeText(payload);
          showToast("投影狀態已複製。");
        } catch {
          showToast("無法使用剪貼簿，請手動複製狀態碼。");
        }
      }

      function openAtlas() {
        renderAtlas();
        els.atlasDrawer.dataset.open = "true";
        els.atlasDrawer.setAttribute("aria-hidden", "false");
        document.getElementById("closeAtlas").focus();
      }

      function closeAtlas() {
        els.atlasDrawer.dataset.open = "false";
        els.atlasDrawer.setAttribute("aria-hidden", "true");
      }

      function renderAll() {
        renderHeader();
        renderModuleList();
        renderStageMeta();
        renderDetail();
        draw();
      }

      function setupEvents() {
        els.moduleSearch.addEventListener("input", () => {
          state.query = els.moduleSearch.value;
          renderModuleList();
        });

        document.querySelectorAll("[data-domain]").forEach((button) => {
          button.addEventListener("click", () => {
            state.domain = button.dataset.domain;
            document.querySelectorAll("[data-domain]").forEach((other) => {
              other.setAttribute("aria-pressed", String(other === button));
            });
            renderModuleList();
          });
        });

        document.querySelectorAll("[role='tab'][data-tab]").forEach((button) => {
          button.addEventListener("click", () => setTab(button.dataset.tab));
        });

        els.timeSlider.addEventListener("input", () => {
          state.time = Number(els.timeSlider.value);
          saveState();
          renderStageMeta();
          draw();
        });

        els.zoomSlider.addEventListener("input", () => {
          state.zoom = Number(els.zoomSlider.value) / 100;
          saveState();
          renderStageMeta();
          draw();
        });

        document.querySelectorAll("[data-layer]").forEach((input) => {
          input.addEventListener("change", () => {
            state.layers[input.dataset.layer] = input.checked;
            saveState();
            draw();
          });
        });

        document.getElementById("resetView").addEventListener("click", resetView);
        document.getElementById("snapshotState").addEventListener("click", copyState);
        document.getElementById("diagnoseNow").addEventListener("click", () => setTab("quiz"));
        document.getElementById("openAtlas").addEventListener("click", openAtlas);
        document.getElementById("closeAtlas").addEventListener("click", closeAtlas);

        document.getElementById("toggleContrast").addEventListener("click", () => {
          document.body.classList.toggle("high-contrast");
          showToast(document.body.classList.contains("high-contrast") ? "已開啟高對比。" : "已關閉高對比。");
        });

        document.getElementById("presentationMode").addEventListener("click", () => {
          state.presentation = !state.presentation;
          document.body.classList.toggle("presentation", state.presentation);
          setTimeout(resizeCanvas, 20);
          showToast(state.presentation ? "教師投影已開啟。" : "教師投影已關閉。");
        });

        els.canvas.addEventListener("pointerdown", (event) => {
          state.pointer.down = true;
          state.pointer.x = event.clientX;
          state.pointer.y = event.clientY;
          els.canvas.setPointerCapture(event.pointerId);
        });

        els.canvas.addEventListener("pointermove", (event) => {
          if (!state.pointer.down) return;
          const dx = event.clientX - state.pointer.x;
          const dy = event.clientY - state.pointer.y;
          state.pointer.x = event.clientX;
          state.pointer.y = event.clientY;
          state.angleY += dx * 0.008;
          state.angleX = clamp(state.angleX + dy * 0.008, -1.15, 1.15);
          saveState();
          renderStageMeta();
          draw();
        });

        els.canvas.addEventListener("pointerup", () => {
          state.pointer.down = false;
        });

        els.canvas.addEventListener("wheel", (event) => {
          event.preventDefault();
          state.zoom = clamp(state.zoom + (event.deltaY > 0 ? -0.05 : 0.05), 0.6, 1.8);
          saveState();
          renderStageMeta();
          draw();
        }, { passive: false });

        els.canvas.addEventListener("keydown", (event) => {
          const keyMap = {
            ArrowLeft: () => { state.angleY -= 0.08; },
            ArrowRight: () => { state.angleY += 0.08; },
            ArrowUp: () => { state.angleX = clamp(state.angleX - 0.08, -1.15, 1.15); },
            ArrowDown: () => { state.angleX = clamp(state.angleX + 0.08, -1.15, 1.15); },
            "+": () => { state.zoom = clamp(state.zoom + 0.05, 0.6, 1.8); },
            "=": () => { state.zoom = clamp(state.zoom + 0.05, 0.6, 1.8); },
            "-": () => { state.zoom = clamp(state.zoom - 0.05, 0.6, 1.8); }
          };
          const action = keyMap[event.key];
          if (!action) return;
          event.preventDefault();
          action();
          saveState();
          renderStageMeta();
          draw();
        });

        window.addEventListener("resize", resizeCanvas);
      }

      function resizeCanvas() {
        const rect = els.canvas.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        els.canvas.width = Math.max(640, Math.round(rect.width * dpr));
        els.canvas.height = Math.max(420, Math.round(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function draw() {
        const rect = els.canvas.getBoundingClientRect();
        const width = rect.width || 1000;
        const height = rect.height || 640;
        ctx.clearRect(0, 0, width, height);
        drawBackground(width, height);

        const item = activeModule();
        const scene = { width, height, cx: width / 2, cy: height / 2, scale: Math.min(width, height) * 0.42 * state.zoom, t: state.time / 100 };

        const drawers = {
          "astro-scale": drawAstro,
          "spectrum-window": drawSpectrum,
          "typhoon-field": drawTyphoon,
          "tide-coast": drawTide,
          "quake-tsunami": drawQuake,
          "dna-rna": drawDnaRna,
          "cell-division": drawCellDivision,
          "geology-section": drawGeology,
          "climate-radiation": drawRadiation
        };

        (drawers[item.id] || drawAstro)(scene);
      }

      function drawBackground(width, height) {
        const grd = ctx.createLinearGradient(0, 0, width, height);
        grd.addColorStop(0, "#0c1722");
        grd.addColorStop(0.55, "#132331");
        grd.addColorStop(1, "#0b141d");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, width, height);

        if (!state.layers.grid) return;
        ctx.save();
        ctx.globalAlpha = 0.26;
        ctx.strokeStyle = "rgba(230, 240, 255, 0.12)";
        ctx.lineWidth = 1;
        const step = 42;
        for (let x = (width % step) - step; x < width + step; x += step) {
          line(x, 0, x, height);
        }
        for (let y = (height % step) - step; y < height + step; y += step) {
          line(0, y, width, y);
        }
        ctx.restore();
      }

      function project(point, scene) {
        const x = point[0];
        const y = point[1];
        const z = point[2];
        const cy = Math.cos(state.angleY);
        const sy = Math.sin(state.angleY);
        const cx = Math.cos(state.angleX);
        const sx = Math.sin(state.angleX);

        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y1 = y * cx - z1 * sx;
        const z2 = y * sx + z1 * cx;
        const perspective = 1 / (1 + z2 * 0.0015);
        return {
          x: scene.cx + x1 * scene.scale * perspective,
          y: scene.cy + y1 * scene.scale * perspective,
          z: z2,
          p: perspective
        };
      }

      function line(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      function circle(x, y, radius, fill, stroke) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.stroke();
        }
      }

      function ellipse(cx, cy, rx, ry, stroke, fill) {
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.stroke();
        }
      }

      function drawLabel(text, x, y, options = {}) {
        if (!state.layers.labels) return;
        ctx.save();
        ctx.font = `${options.weight || 800} ${options.size || 13}px ${getComputedStyle(document.body).fontFamily}`;
        ctx.textAlign = options.align || "center";
        ctx.textBaseline = "middle";
        const metrics = ctx.measureText(text);
        const pad = 6;
        const w = metrics.width + pad * 2;
        const h = (options.size || 13) + pad;
        ctx.fillStyle = options.bg || "rgba(10, 18, 27, 0.72)";
        roundRect(x - w / 2, y - h / 2, w, h, 5);
        ctx.fill();
        ctx.fillStyle = options.color || "rgba(247, 237, 210, 0.94)";
        ctx.fillText(text, x, y + 0.5);
        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function drawArrow(x1, y1, x2, y2, color = "rgba(220, 187, 104, 0.9)", width = 2) {
        if (!state.layers.vectors) return;
        const angle = Math.atan2(y2 - y1, x2 - x1);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - Math.cos(angle - 0.45) * 9, y2 - Math.sin(angle - 0.45) * 9);
        ctx.lineTo(x2 - Math.cos(angle + 0.45) * 9, y2 - Math.sin(angle + 0.45) * 9);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawOrbit(scene, radius, color = "rgba(234, 218, 172, 0.35)") {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i <= 240; i += 1) {
          const a = i / 240 * Math.PI * 2;
          const p = project([Math.cos(a) * radius, 0, Math.sin(a) * radius], scene);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawAstro(scene) {
        drawOrbit(scene, 0.72);
        drawOrbit(scene, 0.16, "rgba(116, 210, 220, 0.35)");

        const sun = project([0, 0, 0], scene);
        const earthAngle = scene.t * Math.PI * 2;
        const earthPos = [Math.cos(earthAngle) * 0.72, 0, Math.sin(earthAngle) * 0.72];
        const earth = project(earthPos, scene);
        const moonAngle = earthAngle * 12.4;
        const moonPos = [
          earthPos[0] + Math.cos(moonAngle) * 0.16,
          Math.sin(moonAngle * 0.7) * 0.025,
          earthPos[2] + Math.sin(moonAngle) * 0.16
        ];
        const moon = project(moonPos, scene);

        const waveRadius = 0.16 * (0.25 + scene.t * 1.2);
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = "rgba(128, 225, 232, 0.58)";
        ctx.setLineDash([5, 8]);
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, waveRadius * scene.scale * 0.35, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        circle(sun.x, sun.y, 34 * sun.p, "rgba(235, 178, 77, 0.98)", "rgba(255, 236, 170, 0.9)");
        circle(earth.x, earth.y, 15 * earth.p, "rgba(72, 156, 211, 0.98)", "rgba(210, 238, 250, 0.9)");
        circle(moon.x, moon.y, 8 * moon.p, "rgba(222, 219, 205, 0.96)", "rgba(255,255,255,0.8)");
        drawArrow(moon.x, moon.y, earth.x, earth.y, "rgba(126, 226, 231, 0.88)", 2);

        drawLabel("太陽", sun.x, sun.y - 48);
        drawLabel("地球", earth.x, earth.y - 30);
        drawLabel("月球訊號波前", moon.x, moon.y + 30);
        if (state.layers.misconception) {
          drawCallout("不要量示意圖比例；先找題目給的距離比例，再乘光行時間。", scene.width * 0.5, 52);
        }
      }

      function drawSpectrum(scene) {
        const left = scene.width * 0.11;
        const right = scene.width * 0.89;
        const top = scene.height * 0.26;
        const bandH = scene.height * 0.18;
        const bands = [
          ["γ", "#b889ff", 0.08],
          ["X", "#8bc3ff", 0.16],
          ["紫外", "#7d8bff", 0.28],
          ["可見光", "#f5d66f", 0.43],
          ["紅外", "#ff9b63", 0.61],
          ["微波", "#75d8bc", 0.79],
          ["無線電", "#9fdcff", 0.92]
        ];

        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,0.06)";
        roundRect(left, top, right - left, bandH, 8);
        ctx.fill();

        for (const [name, color, pos] of bands) {
          const x = left + (right - left) * pos;
          ctx.fillStyle = color;
          ctx.globalAlpha = name === "紅外" ? 0.9 : 0.65;
          roundRect(x - 42, top + 22, 84, bandH - 44, 6);
          ctx.fill();
          ctx.globalAlpha = 1;
          drawLabel(name, x, top + bandH + 28, { bg: "rgba(6,12,18,0.72)", size: 12 });
        }
        ctx.restore();

        const earthY = scene.height * 0.72;
        ellipse(scene.width * 0.5, earthY, scene.width * 0.34, 32, "rgba(126, 226, 231, 0.4)", "rgba(85, 142, 175, 0.22)");
        drawLabel("地球大氣吸收帶", scene.width * 0.5, earthY - 48);

        const t = scene.t;
        for (let i = 0; i < 11; i += 1) {
          const x = left + (right - left) * (i / 10);
          const absorb = Math.sin(i * 1.7 + t * 5) * 0.5 + 0.5;
          ctx.strokeStyle = `rgba(246, 218, 142, ${0.2 + absorb * 0.45})`;
          ctx.lineWidth = 2 + absorb * 5;
          line(x, top + bandH + 54, x + Math.sin(i) * 22, earthY - 26);
        }

        if (state.layers.vectors) {
          drawArrow(scene.width * 0.68, top + 35, scene.width * 0.56, earthY - 28, "rgba(255, 161, 100, 0.88)", 3);
          drawArrow(scene.width * 0.44, earthY - 18, scene.width * 0.44, top + 56, "rgba(245, 214, 111, 0.8)", 2);
        }

        if (state.layers.misconception) {
          drawCallout("低溫星雲常看紅外；不是能量越高越適合。大氣吸收會決定望遠鏡位置。", scene.width * 0.5, 52);
        }
      }

      function drawTyphoon(scene) {
        const mapX = scene.width * 0.52;
        const mapY = scene.height * 0.5;
        const radius = scene.scale * 0.62;
        ctx.save();
        ctx.strokeStyle = "rgba(222, 230, 214, 0.36)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(mapX - radius * 0.28, mapY - radius * 0.58);
        ctx.bezierCurveTo(mapX - radius * 0.08, mapY - radius * 0.34, mapX - radius * 0.18, mapY - radius * 0.12, mapX - radius * 0.02, mapY + radius * 0.12);
        ctx.bezierCurveTo(mapX + radius * 0.1, mapY + radius * 0.31, mapX + radius * 0.05, mapY + radius * 0.52, mapX - radius * 0.14, mapY + radius * 0.62);
        ctx.stroke();

        const t = scene.t;
        const cx = mapX + radius * (-0.48 + t * 0.9);
        const cy = mapY + radius * (0.35 - t * 0.68);
        ctx.setLineDash([8, 9]);
        ctx.strokeStyle = "rgba(245, 214, 111, 0.65)";
        ctx.beginPath();
        ctx.moveTo(mapX - radius * 0.48, mapY + radius * 0.35);
        ctx.quadraticCurveTo(mapX - radius * 0.08, mapY + radius * 0.08, mapX + radius * 0.2, mapY - radius * 0.34);
        ctx.stroke();
        ctx.setLineDash([]);

        for (let r = 0.16; r <= 0.48; r += 0.16) {
          ctx.strokeStyle = `rgba(126,226,231,${0.32 - r * 0.25})`;
          ctx.lineWidth = 2;
          circle(cx, cy, radius * r, null, ctx.strokeStyle);
        }

        for (let i = 0; i < 18; i += 1) {
          const a = i / 18 * Math.PI * 2 + t * 1.2;
          const rr = radius * (0.16 + (i % 4) * 0.08);
          const x = cx + Math.cos(a) * rr;
          const y = cy + Math.sin(a) * rr;
          const tangent = a + Math.PI / 2;
          drawArrow(x, y, x + Math.cos(tangent) * 34, y + Math.sin(tangent) * 34, "rgba(235, 238, 214, 0.66)", 1.6);
        }

        const stationA = { x: mapX - radius * 0.12, y: mapY - radius * 0.28, name: "測站甲" };
        const stationB = { x: mapX + radius * 0.12, y: mapY - radius * 0.46, name: "測站乙" };
        circle(stationA.x, stationA.y, 6, "rgba(246, 218, 142, 1)", null);
        circle(stationB.x, stationB.y, 6, "rgba(126, 226, 231, 1)", null);
        drawLabel(stationA.name, stationA.x, stationA.y - 24);
        drawLabel(stationB.name, stationB.x, stationB.y - 24);
        drawLabel("颱風中心", cx, cy - 22);

        if (state.layers.misconception) {
          drawCallout("當地風向看測站在颱風中心哪一側，不是直接看中心移動方向。", scene.width * 0.5, 52);
        }
        ctx.restore();
      }

      function drawTide(scene) {
        const earth = project([0, 0, 0], scene);
        const moonAngle = scene.t * Math.PI * 2;
        const moonPos = [Math.cos(moonAngle) * 0.78, -0.05, Math.sin(moonAngle) * 0.78];
        const moon = project(moonPos, scene);

        drawOrbit(scene, 0.78, "rgba(226, 235, 245, 0.24)");
        circle(earth.x, earth.y, 56 * earth.p, "rgba(70, 148, 188, 0.95)", "rgba(220, 243, 255, 0.66)");

        ctx.save();
        ctx.translate(earth.x, earth.y);
        ctx.rotate(moonAngle + state.angleY * 0.35);
        ellipse(0, 0, 102 * state.zoom, 54 * state.zoom, "rgba(126, 226, 231, 0.8)", "rgba(126, 226, 231, 0.14)");
        ctx.restore();

        circle(moon.x, moon.y, 14 * moon.p, "rgba(224, 221, 207, 0.96)", "rgba(255,255,255,0.74)");
        drawArrow(moon.x, moon.y, earth.x, earth.y, "rgba(246, 218, 142, 0.68)", 2);
        drawLabel("月球", moon.x, moon.y - 30);
        drawLabel("潮汐隆起", earth.x, earth.y + 82);

        const chartX = scene.width * 0.08;
        const chartY = scene.height * 0.66;
        const chartW = scene.width * 0.84;
        const chartH = scene.height * 0.2;
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.lineWidth = 1;
        roundRect(chartX, chartY, chartW, chartH, 8);
        ctx.stroke();

        const stations = [
          ["臺北港", 0, "rgba(246,218,142,0.9)"],
          ["臺中港", 0.18, "rgba(126,226,231,0.9)"],
          ["花蓮", 0.34, "rgba(255,158,119,0.9)"],
          ["馬祖", 0.52, "rgba(180,142,255,0.9)"]
        ];
        stations.forEach(([name, phase, color], sIndex) => {
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          for (let i = 0; i <= 220; i += 1) {
            const x = chartX + i / 220 * chartW;
            const wave = Math.sin(i / 220 * Math.PI * 8 + scene.t * Math.PI * 4 + phase * Math.PI * 2);
            const amp = chartH * (0.18 + sIndex * 0.025);
            const y = chartY + chartH * (0.52 + sIndex * 0.035) + wave * amp;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          drawLabel(name, chartX + 52 + sIndex * 82, chartY - 18, { size: 11, bg: "rgba(10,18,27,0.6)" });
        });
        ctx.restore();

        if (state.layers.misconception) {
          drawCallout("潮差看高度差；是否同時滿潮看相位，也就是波峰出現時間。", scene.width * 0.5, 52);
        }
      }

      function drawQuake(scene) {
        const baseY = scene.height * 0.58;
        ctx.save();
        ctx.fillStyle = "rgba(96, 123, 122, 0.28)";
        ctx.beginPath();
        ctx.moveTo(scene.width * 0.08, baseY);
        ctx.lineTo(scene.width * 0.92, baseY);
        ctx.lineTo(scene.width * 0.92, scene.height * 0.9);
        ctx.lineTo(scene.width * 0.08, scene.height * 0.9);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(85, 107, 132, 0.5)";
        ctx.beginPath();
        ctx.moveTo(scene.width * 0.12, baseY + 30);
        ctx.lineTo(scene.width * 0.7, baseY + 220);
        ctx.lineTo(scene.width * 0.9, baseY + 220);
        ctx.lineTo(scene.width * 0.32, baseY + 30);
        ctx.closePath();
        ctx.fill();

        const epicenter = { x: scene.width * 0.42, y: baseY + 28 };
        circle(epicenter.x, epicenter.y, 8, "rgba(255,116,86,0.95)", null);
        drawLabel("震源投影", epicenter.x, epicenter.y - 28);

        const wave = scene.t;
        const pR = 36 + wave * scene.width * 0.42;
        const sR = 24 + wave * scene.width * 0.24;
        const tsunamiR = 12 + wave * scene.width * 0.18;

        ctx.globalAlpha = 0.84;
        circle(epicenter.x, epicenter.y, pR, null, "rgba(126,226,231,0.55)");
        circle(epicenter.x, epicenter.y, sR, null, "rgba(246,218,142,0.62)");
        ctx.setLineDash([8, 8]);
        circle(epicenter.x, baseY, tsunamiR, null, "rgba(129,174,255,0.66)");
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;

        const coastX = scene.width * 0.76;
        ctx.strokeStyle = "rgba(250,242,210,0.78)";
        ctx.lineWidth = 3;
        line(coastX, baseY - 70, coastX + 20, scene.height * 0.88);
        drawLabel("海岸線", coastX + 42, baseY - 34);

        drawArrow(epicenter.x, epicenter.y, coastX, baseY + 30, "rgba(246,218,142,0.75)", 2);
        drawLabel("P波快、S波慢、海嘯波另算", scene.width * 0.5, scene.height * 0.18);

        if (state.layers.misconception) {
          drawCallout("預警時間 = S波抵達時間 - P波抵達時間 - 發布所需時間。", scene.width * 0.5, 52);
        }
        ctx.restore();
      }

      function drawDnaRna(scene) {
        const cx = scene.width * 0.47;
        const cy = scene.height * 0.48;
        const height = scene.height * 0.62;
        const turns = 4.2;
        const pointsA = [];
        const pointsB = [];
        for (let i = 0; i <= 160; i += 1) {
          const u = i / 160;
          const a = u * Math.PI * 2 * turns + scene.t * Math.PI * 2;
          const y = cy - height / 2 + u * height;
          const xA = cx + Math.cos(a) * 78 * state.zoom;
          const xB = cx + Math.cos(a + Math.PI) * 78 * state.zoom;
          const zA = Math.sin(a);
          pointsA.push({ x: xA, y, z: zA });
          pointsB.push({ x: xB, y, z: -zA });
        }

        ctx.save();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(126,226,231,0.86)";
        drawPolyline(pointsA);
        ctx.strokeStyle = "rgba(246,218,142,0.86)";
        drawPolyline(pointsB);

        for (let i = 8; i < pointsA.length; i += 14) {
          const a = pointsA[i];
          const b = pointsB[i];
          ctx.strokeStyle = i % 28 === 0 ? "rgba(255,158,119,0.74)" : "rgba(255,255,255,0.34)";
          ctx.lineWidth = 2;
          line(a.x, a.y, b.x, b.y);
          if (state.layers.labels && i % 42 === 0) {
            drawLabel(i % 84 === 0 ? "A=T" : "G≡C", (a.x + b.x) / 2, a.y, { size: 11 });
          }
        }

        const rnaX = scene.width * 0.72;
        ctx.strokeStyle = "rgba(255, 158, 119, 0.9)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < 90; i += 1) {
          const y = cy - height * 0.32 + i / 90 * height * 0.64;
          const x = rnaX + Math.sin(i / 90 * Math.PI * 7 + scene.t * 4) * 24;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        drawArrow(cx + 120, cy, rnaX - 62, cy, "rgba(246,218,142,0.76)", 3);
        drawLabel("轉錄", (cx + rnaX) / 2, cy - 34);
        drawLabel("microRNA 配對抑制", rnaX, cy + height * 0.38);
        ctx.strokeStyle = "rgba(199,148,255,0.88)";
        ctx.lineWidth = 3;
        line(rnaX - 44, cy + height * 0.22, rnaX + 44, cy + height * 0.22);
        line(rnaX - 38, cy + height * 0.25, rnaX + 38, cy + height * 0.25);

        if (state.layers.misconception) {
          drawCallout("RNA 參與訊息傳遞與調控；microRNA 不是蛋白質，也不是把 DNA 消掉。", scene.width * 0.5, 52);
        }
        ctx.restore();
      }

      function drawPolyline(points) {
        ctx.beginPath();
        points.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.stroke();
      }

      function drawCellDivision(scene) {
        const phases = ["G1", "S", "G2", "M"];
        const t = scene.t * phases.length;
        const phaseIndex = Math.min(phases.length - 1, Math.floor(t));
        const phase = phases[phaseIndex];
        const cx = scene.width * 0.48;
        const cy = scene.height * 0.45;
        const r = Math.min(scene.width, scene.height) * 0.2 * state.zoom;

        ctx.save();
        circle(cx, cy, r, "rgba(126,226,231,0.1)", "rgba(126,226,231,0.62)");
        circle(cx, cy, r * 0.58, "rgba(255,255,255,0.06)", "rgba(255,255,255,0.2)");
        drawLabel(`階段 ${phase}`, cx, cy - r - 28);

        const chromCount = phase === "M" ? 8 : 6;
        for (let i = 0; i < chromCount; i += 1) {
          const angle = i / chromCount * Math.PI * 2 + scene.t * Math.PI;
          const spread = phase === "M" ? r * 0.55 : r * 0.32;
          const x = cx + Math.cos(angle) * spread;
          const y = cy + Math.sin(angle) * spread * 0.6;
          drawChromosome(x, y, phase === "S" || phase === "G2" || phase === "M", angle);
        }

        if (phase === "M") {
          drawArrow(cx - r * 0.9, cy, cx - r * 0.25, cy, "rgba(246,218,142,0.78)", 2);
          drawArrow(cx + r * 0.9, cy, cx + r * 0.25, cy, "rgba(246,218,142,0.78)", 2);
        }

        const graphX = scene.width * 0.12;
        const graphY = scene.height * 0.73;
        const graphW = scene.width * 0.76;
        const graphH = scene.height * 0.14;
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        roundRect(graphX, graphY, graphW, graphH, 8);
        ctx.stroke();

        ctx.strokeStyle = "rgba(246,218,142,0.9)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i <= 100; i += 1) {
          const u = i / 100;
          const dna = u < 0.25 ? 0.72 : u < 0.5 ? 0.72 + (u - 0.25) / 0.25 * 0.42 : u < 0.85 ? 1.14 : 0.72;
          const x = graphX + u * graphW;
          const y = graphY + graphH - dna * graphH * 0.62;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        const markerX = graphX + scene.t * graphW;
        drawArrow(markerX, graphY - 12, markerX, graphY + graphH, "rgba(255,158,119,0.9)", 2);
        drawLabel("DNA含量", graphX + 60, graphY - 18);

        if (state.layers.misconception) {
          drawCallout("DNA 含量變多，不等於染色體套數變成三套；先分清含量與套數。", scene.width * 0.5, 52);
        }
        ctx.restore();
      }

      function drawChromosome(x, y, doubled, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.strokeStyle = "rgba(255,158,119,0.92)";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        if (doubled) {
          line(-10, -14, 10, 14);
          line(10, -14, -10, 14);
        } else {
          line(0, -14, 0, 14);
        }
        ctx.restore();
      }

      function drawGeology(scene) {
        const cx = scene.width * 0.5;
        const cy = scene.height * 0.55;
        const w = scene.width * 0.62 * state.zoom;
        const h = scene.height * 0.38 * state.zoom;
        const layers = [
          ["rgba(208, 160, 96, 0.88)", "砂岩"],
          ["rgba(98, 136, 124, 0.9)", "頁岩"],
          ["rgba(147, 106, 78, 0.92)", "礫岩"],
          ["rgba(82, 104, 136, 0.92)", "石灰岩"]
        ];

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(state.angleY * 0.08);
        for (let i = 0; i < layers.length; i += 1) {
          const y = -h / 2 + i * h / layers.length;
          ctx.fillStyle = layers[i][0];
          ctx.beginPath();
          ctx.moveTo(-w / 2, y + Math.sin(scene.t * 5 + i) * 8);
          ctx.lineTo(w / 2, y + Math.cos(scene.t * 4 + i) * 8);
          ctx.lineTo(w / 2, y + h / layers.length + Math.cos(scene.t * 4 + i + 1) * 8);
          ctx.lineTo(-w / 2, y + h / layers.length + Math.sin(scene.t * 5 + i + 1) * 8);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.16)";
          ctx.stroke();
          drawLabel(layers[i][1], cx - w * 0.43, cy + y + h / layers.length * 0.5, { size: 11 });
        }

        ctx.strokeStyle = "rgba(255,255,255,0.84)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-w * 0.12, -h * 0.58);
        ctx.lineTo(w * 0.16, h * 0.58);
        ctx.stroke();
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = "rgba(246,218,142,0.88)";
        ctx.beginPath();
        ctx.moveTo(-w * 0.05, -h * 0.58);
        ctx.lineTo(w * 0.23, h * 0.58);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        drawLabel("斷層切割岩層 → 斷層事件較晚", scene.width * 0.5, scene.height * 0.19);
        if (state.layers.vectors) {
          drawArrow(cx + w * 0.2, cy - h * 0.22, cx + w * 0.28, cy - h * 0.04, "rgba(246,218,142,0.85)", 2);
          drawArrow(cx - w * 0.12, cy + h * 0.2, cx - w * 0.2, cy + h * 0.02, "rgba(246,218,142,0.85)", 2);
        }

        if (state.layers.misconception) {
          drawCallout("地質順序先問『誰切誰』；不要只用現在的高低或顏色判斷年代。", scene.width * 0.5, 52);
        }
      }

      function drawRadiation(scene) {
        const groundY = scene.height * 0.74;
        const atmY = scene.height * 0.38;

        ctx.save();
        ctx.fillStyle = "rgba(88, 142, 170, 0.22)";
        roundRect(scene.width * 0.12, atmY - 55, scene.width * 0.76, 110, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(126,226,231,0.28)";
        ctx.stroke();

        ctx.fillStyle = "rgba(112, 104, 82, 0.55)";
        roundRect(scene.width * 0.08, groundY, scene.width * 0.84, scene.height * 0.16, 10);
        ctx.fill();

        drawLabel("大氣層", scene.width * 0.5, atmY - 78);
        drawLabel("地表", scene.width * 0.5, groundY + 34);

        drawArrow(scene.width * 0.2, scene.height * 0.12, scene.width * 0.38, groundY - 12, "rgba(246,218,142,0.9)", 4);
        drawArrow(scene.width * 0.48, groundY - 12, scene.width * 0.45, atmY + 46, "rgba(255,158,119,0.9)", 4);
        drawArrow(scene.width * 0.57, atmY - 46, scene.width * 0.65, scene.height * 0.13, "rgba(255,158,119,0.66)", 3);
        drawArrow(scene.width * 0.6, atmY + 38, scene.width * 0.56, groundY - 12, "rgba(255,158,119,0.58)", 3);

        const chartX = scene.width * 0.12;
        const chartY = scene.height * 0.12;
        const chartW = scene.width * 0.74;
        const chartH = scene.height * 0.18;
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        roundRect(chartX, chartY, chartW, chartH, 8);
        ctx.stroke();

        ctx.strokeStyle = "rgba(126,226,231,0.78)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i <= 160; i += 1) {
          const u = i / 160;
          const peak = Math.exp(-Math.pow((u - 0.46) / 0.18, 2));
          const notch = 0.28 * Math.exp(-Math.pow((u - (0.56 + scene.t * 0.06)) / 0.035, 2));
          const y = chartY + chartH - (peak - notch) * chartH * 0.78 - 12;
          const x = chartX + u * chartW;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        drawLabel("向外熱輻射頻譜", chartX + chartW * 0.5, chartY + chartH + 24);

        if (state.layers.misconception) {
          drawCallout("短波入、長波出；溫室氣體主要改變長波吸收與再放射。", scene.width * 0.5, 52);
        }
        ctx.restore();
      }

      function drawCallout(text, x, y) {
        ctx.save();
        const maxW = Math.min(720, Math.max(260, ctx.canvas.getBoundingClientRect().width - 48));
        ctx.font = `800 14px ${getComputedStyle(document.body).fontFamily}`;
        const lines = wrapText(text, maxW - 32);
        const h = lines.length * 22 + 22;
        const w = Math.min(maxW, Math.max(...lines.map((lineText) => ctx.measureText(lineText).width)) + 34);
        ctx.fillStyle = "rgba(246, 218, 142, 0.92)";
        roundRect(x - w / 2, y - h / 2, w, h, 8);
        ctx.fill();
        ctx.fillStyle = "rgba(39, 31, 18, 0.95)";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        lines.forEach((lineText, index) => {
          ctx.fillText(lineText, x, y - (lines.length - 1) * 11 + index * 22);
        });
        ctx.restore();
      }

      function wrapText(text, maxWidth) {
        const chars = Array.from(text);
        const lines = [];
        let lineText = "";
        for (const char of chars) {
          const test = lineText + char;
          if (ctx.measureText(test).width > maxWidth && lineText) {
            lines.push(lineText);
            lineText = char;
          } else {
            lineText = test;
          }
        }
        if (lineText) lines.push(lineText);
        return lines.slice(0, 3);
      }

      function initHashState() {
        const raw = location.hash.replace(/^#state=/, "");
        if (!raw || raw === location.hash) return;
        importState(raw);
      }

      function boot() {
        loadState();
        initHashState();
        setupEvents();
        syncLayerInputs();
        resizeCanvas();
        renderAll();
      }

      boot();
    })();
  </script>
</body>
